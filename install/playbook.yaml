- name: Zamfono packages builder host
  hosts: builder
  become: true
  vars:
    code_dir: /opt/zamfono/packages-builder
    state_dir: /var/lib/zamfono/packages-builder
    packages_private_ip: 10.250.0.2
  tasks:
    # First: converge to fully patched before configuring anything — a fresh
    # server image is weeks stale, and unattended-upgrades only covers the
    # security origin on its own daily schedule.
    - name: Update and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Check whether the upgrade requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot onto the upgraded packages
      ansible.builtin.reboot:
      when: reboot_required.stat.exists

    - name: Install host packages
      ansible.builtin.apt:
        name:
          - pbuilder
          - dpkg-dev
          - devscripts
          # dch validates distribution names with it; absent, it warns on
          # every changelog stamp:
          - libdistro-info-perl
          - lintian
          - podman
          - python3
          - gnupg
          - unattended-upgrades
        state: present
        update_cache: true

    # Automatic-Reboot is safe here: an interrupted build is simply repeated
    # at the next timer firing. The fixed 03:00 reboot time sits inside the
    # timer's 02:00-03:30 gap, so no build runs into it — without it,
    # apt-daily-upgrade's 06:00+-60min run would reboot whenever it pleases,
    # possibly during a build.
    - name: Enable unattended security upgrades with automatic reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";
        mode: "0644"

    # cloud-init would otherwise reset the hostname at every boot to the
    # name the Hetzner metadata service reports, which is the server's name
    # at creation and does not follow a rename.
    - name: Keep the hostname across reboots
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-zamfono-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: State directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ state_dir }}/run"
        - "{{ state_dir }}/workspace"
        - /etc/zamfono/pbuilder-hooks

    - name: Deploy orchestrator code
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ code_dir }}/{{ item }}"
        mode: preserve
      loop:
        - orchestrator/
        - manifest/
        - packaging/

    - name: pbuilder configuration
      ansible.builtin.copy:
        src: files/pbuilderrc
        dest: /etc/zamfono/pbuilderrc
        mode: "0644"

    # A follower (non-amd64) builder verifies the source it downloads from
    # the archive against this keyring; a copy of zamfono/packages'
    # keyring/zamfono-archive-keyring.gpg, so a subkey event updates both.
    - name: Archive keyring
      ansible.builtin.copy:
        src: files/zamfono-archive-keyring.gpg
        dest: /etc/zamfono/zamfono-archive-keyring.gpg
        mode: "0644"

    - name: sid debhelper pin hook
      ansible.builtin.copy:
        src: files/D70zamfono-sid
        dest: /etc/zamfono/pbuilder-hooks/D70zamfono-sid
        mode: "0755"

    - name: Create the trixie base chroot tarball
      ansible.builtin.command:
        cmd: pbuilder create --configfile /etc/zamfono/pbuilderrc
        creates: /var/cache/pbuilder/base-trixie.tgz

    - name: Pin the packages host's SSH identity (first provisioning trusts
        the private network once; every later connection verifies against it)
      ansible.builtin.shell: |
        grep -q "^{{ packages_private_ip }} " /root/.ssh/known_hosts 2>/dev/null && exit 9
        mkdir -p /root/.ssh
        ssh-keyscan -t ed25519 {{ packages_private_ip }} >> /root/.ssh/known_hosts
      register: keyscan
      changed_when: keyscan.rc == 0
      failed_when: keyscan.rc not in [0, 9]

    - name: systemd service
      ansible.builtin.copy:
        src: files/packages-builder.service
        dest: /etc/systemd/system/packages-builder.service
        mode: "0644"

    - name: systemd timer (every five minutes, with a gap around the reboot)
      ansible.builtin.copy:
        src: files/packages-builder.timer
        dest: /etc/systemd/system/packages-builder.timer
        mode: "0644"

    - name: Enable the timer
      ansible.builtin.systemd_service:
        name: packages-builder.timer
        enabled: true
        state: started
        daemon_reload: true
